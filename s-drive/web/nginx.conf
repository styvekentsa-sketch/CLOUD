# S-Drive — Nginx : fichiers de l'interface + relais de l'API

# Protocole d'origine : celui annoncé par Cloudflare (https) sinon celui de la connexion
map $http_x_forwarded_proto $sdrive_proto {
	default $http_x_forwarded_proto;
	""      $scheme;
}
server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	server_tokens off;

	# En-têtes de sécurité
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
	add_header Referrer-Policy "same-origin" always;
	add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
	add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

	# API -> conteneur "api"
	location /api/ {
		proxy_pass http://api:3000;
		proxy_http_version 1.1;
		proxy_set_header Host $http_host;
		proxy_set_header X-Forwarded-Host $http_host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		# Derrière Cloudflare, garder le protocole d'origine (https)
		proxy_set_header X-Forwarded-Proto $sdrive_proto;
		client_max_body_size 64k;
	}

	# Fichiers versionnés par Vite : cache long
	location /assets/ {
		expires 1y;
		add_header Cache-Control "public, immutable" always;
		add_header X-Content-Type-Options "nosniff" always;
		try_files $uri =404;
	}

	location = /manifest.webmanifest {
		default_type application/manifest+json;
		try_files $uri =404;
	}

	# Application monopage : toutes les autres adresses -> index.html
	location / {
		# no-store : la page n’est jamais gardée en cache (ni restaurée par « Précédent »
		# après une déconnexion). Les fichiers /assets/ restent en cache longue durée.
		add_header Cache-Control "no-store" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-Frame-Options "DENY" always;
		add_header Referrer-Policy "same-origin" always;
		add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
		try_files $uri /index.html;
	}
}
