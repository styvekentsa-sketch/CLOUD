# =============================================================================
#  Nginx Proxy Manager — à coller dans : Proxy Host > Edit > onglet "Advanced"
#  (Custom Nginx Configuration) pour l'hôte Nextcloud.
# =============================================================================

# Aucun filtrage par extension : .crypt14, .db, .bak, .tar, .gz… passent tels
# quels (Nginx ne fait que relayer ; c'est Nextcloud qui stocke). Laisser
# DÉCOCHÉE l'option "Block Common Exploits" de NPM pour cet hôte : ses règles
# sur les URL/requêtes peuvent renvoyer des 403 sur certaines requêtes WebDAV.

# Uploads illimités / longs (les clients Nextcloud découpent en morceaux)
client_max_body_size 0;
client_body_buffer_size 512k;
proxy_request_buffering off;
proxy_buffering off;
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
send_timeout 3600s;

# HSTS (6 mois) — activer seulement une fois le HTTPS validé
add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

# Découverte CalDAV / CardDAV (iOS, macOS, DAVx5 sur Android)
location = /.well-known/carddav { return 301 $scheme://$host/remote.php/dav; }
location = /.well-known/caldav  { return 301 $scheme://$host/remote.php/dav; }
