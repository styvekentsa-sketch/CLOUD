# =============================================================================
#  Apache (conteneur Nextcloud) — compression + réglages réseau pour mobiles
#  Monté dans /etc/apache2/conf-enabled/zz-nextcloud-network.conf
# =============================================================================

# --- Chargement des modules (sans erreur s'ils sont absents de l'image) -------
<IfModule !filter_module>
  <IfFile /usr/lib/apache2/modules/mod_filter.so>
    LoadModule filter_module /usr/lib/apache2/modules/mod_filter.so
  </IfFile>
</IfModule>
<IfModule !deflate_module>
  <IfFile /usr/lib/apache2/modules/mod_deflate.so>
    LoadModule deflate_module /usr/lib/apache2/modules/mod_deflate.so
  </IfFile>
</IfModule>
<IfModule !brotli_module>
  <IfFile /usr/lib/apache2/modules/mod_brotli.so>
    LoadModule brotli_module /usr/lib/apache2/modules/mod_brotli.so
  </IfFile>
</IfModule>

# --- Ne PAS compresser les téléchargements de fichiers WebDAV (GET) -----------
#  Les clients de synchro s'appuient sur Content-Length / Range (reprise des
#  transferts) : la compression à la volée casserait la reprise. Les réponses
#  PROPFIND (listes de dossiers en XML) restent compressées.
SetEnvIfExpr "%{REQUEST_METHOD} == 'GET' && %{REQUEST_URI} =~ m#^/(remote|public)\.php/(web)?dav/#" no-gzip no-brotli
SetEnvIf Range "." no-gzip no-brotli

# --- Types compressés : textes, XML WebDAV, JSON API, JS/CSS, SVG -------------
#  Les images (JPEG/PNG/WebP des aperçus) et vidéos sont déjà compressées :
#  les recompresser coûterait du CPU sans rien gagner.
<IfModule mod_brotli.c>
  BrotliCompressionQuality 5
  AddOutputFilterByType BROTLI_COMPRESS text/html text/plain text/css text/xml text/calendar text/vcard text/javascript application/javascript application/x-javascript application/json application/xml application/xhtml+xml application/rss+xml application/manifest+json application/vnd.api+json image/svg+xml image/x-icon font/ttf font/otf application/wasm
</IfModule>
<IfModule mod_deflate.c>
  DeflateCompressionLevel 6
  AddOutputFilterByType DEFLATE text/html text/plain text/css text/xml text/calendar text/vcard text/javascript application/javascript application/x-javascript application/json application/xml application/xhtml+xml application/rss+xml application/manifest+json application/vnd.api+json image/svg+xml image/x-icon font/ttf font/otf application/wasm
</IfModule>
# (Brotli est utilisé si le client l'accepte, sinon Gzip : DEFLATE ne recompresse
#  pas une réponse déjà encodée.)

# --- Uploads lents (smartphone en Wi-Fi faible) : pas de coupure prématurée ---
Timeout 3600
<IfModule reqtimeout_module>
  RequestReadTimeout header=20-60,MinRate=500 body=3600,MinRate=1
</IfModule>
KeepAliveTimeout 15
MaxKeepAliveRequests 500
