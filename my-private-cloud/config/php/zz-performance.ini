; =============================================================================
;  Optimisations PHP pour Nextcloud (chargé après nextcloud.ini de l'image)
;  memory_limit / upload_max_filesize / post_max_size sont pilotés par .env
;  (PHP_MEMORY_LIMIT, PHP_UPLOAD_LIMIT) — ne pas les redéfinir ici.
; =============================================================================

; --- Gros fichiers : uploads longs sans timeout ------------------------------
max_execution_time = 3600
max_input_time = 3600
default_socket_timeout = 3600
output_buffering = 0

; --- OPcache (recommandations officielles Nextcloud) -------------------------
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
opcache.revalidate_freq = 60
opcache.save_comments = 1
opcache.jit = 1255
opcache.jit_buffer_size = 128M

; --- APCu (cache local mémoire) ----------------------------------------------
apc.enable_cli = 1
apc.shm_size = 128M

; --- Sécurité -----------------------------------------------------------------
expose_php = Off
